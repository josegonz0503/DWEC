<!DOCTYPE html>
<html lang="ca">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pop Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <p id="infoUsuario"></p>
    <p style="display: block; font-size: 30px; color: black;">Complete el formulari</p>

    <button>Fes clic!</button>

    <div class="contenidorPopup" style="display: none;">
        <div class="popup">
            <span class="tanca-popup">✖</span>
            <div class="contenedor">
                <form id="form" class="form">
                    <h2>Registra't amb nosaltres</h2>

                    <div class="form-control">
                        <label for="nomusuari">Nom d'usuari</label>
                        <input type="text" id="nomusuari" placeholder="Introdueix el teu nom d'usuari">
                        <small>Error message</small>
                    </div>

                    <div class="form-control">
                        <label for="email">Correu electrònic</label>
                        <input type="email" id="email" placeholder="Introdueix el teu correu electrònic">
                        <small>Error message</small>
                    </div>

                    <div class="form-control">
                        <label for="contrasenya">Contrasenya</label>
                        <input type="password" id="contrasenya" placeholder="Introdueix la teva contrasenya">
                        <small>Error message</small>
                    </div>

                    <div class="form-control">
                        <label for="contrasenya2">Confirma la contrasenya</label>
                        <input type="password" id="contrasenya2" placeholder="Confirma la teva contrasenya">
                        <small>Error message</small>
                    </div>

                    <button type="submit">Enviar</button>
                </form>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
